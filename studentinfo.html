<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student records</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d1526;
    --bg-mid:#141f38;
    --teal:#2dd4bf;
    --amber:#f0a94e;
    --coral:#f2727a;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.14);
    --text-hi:#eef1f6;
    --text-lo:#9aa5b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 15% 20%, #16223f 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, #172a3a 0%, transparent 50%),
                linear-gradient(160deg, var(--bg-deep), var(--bg-mid));
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--text-hi);
    overflow-x:hidden;
  }

  /* ambient drifting orbs */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }
  .orb1{width:380px;height:380px;background:var(--teal);top:-100px;left:-100px;animation:drift1 22s ease-in-out infinite;}
  .orb2{width:320px;height:320px;background:var(--amber);bottom:-80px;right:-60px;animation:drift2 26s ease-in-out infinite;}
  .orb3{width:260px;height:260px;background:var(--coral);top:40%;left:60%;animation:drift3 30s ease-in-out infinite;}

  @keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
  @keyframes drift3{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,50px);}}

  @media (prefers-reduced-motion: reduce){
    .orb{animation:none;}
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:960px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:36px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:32px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--text-lo);
  }

  /* glass panel base */
  .glass{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:16px;
  }

  /* toolbar */
  .toolbar{
    display:flex;
    gap:12px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .search{
    flex:1;
    min-width:180px;
    padding:12px 16px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--text-hi);
    background:transparent;
    border:none;
    outline:none;
  }
  .search::placeholder{color:var(--text-lo);}
  .toolbar .glass{display:flex;align-items:center;flex:1;min-width:200px;}

  button{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:14px;
    cursor:pointer;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--amber);
    color:#2b1a05;
  }
  .btn-primary:hover{background:#f4bc72;}
  .btn-ghost{
    background:transparent;
    color:var(--text-lo);
    border:1px solid var(--glass-border);
  }
  .btn-ghost:hover{color:var(--text-hi);border-color:var(--text-lo);}

  /* add form */
  #addForm{
    display:none;
    padding:20px;
    margin-bottom:24px;
    gap:12px;
    flex-wrap:wrap;
  }
  #addForm.open{display:flex;}
  #addForm input{
    flex:1;
    min-width:120px;
    padding:10px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--text-hi);
    background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-border);
    border-radius:10px;
    outline:none;
  }
  #addForm input:focus{border-color:var(--teal);}
  #addForm input::placeholder{color:var(--text-lo);}

  /* student grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }

  .card{
    position:relative;
    padding:20px;
    overflow:hidden;
    transition:transform 0.3s ease, opacity 0.3s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:-150%;
    width:60%;height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.10), transparent);
    transform:skewX(-20deg);
    transition:left 0.6s ease;
  }
  .card:hover::before{left:150%;}
  .card:hover{transform:translateY(-3px);}

  .card.removing{
    animation:cardOut 0.35s ease forwards;
  }
  @keyframes cardOut{
    to{opacity:0; transform:scale(0.9) translateY(6px);}
  }
  .card.entering{
    animation:cardIn 0.4s ease;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(10px) scale(0.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .card-id{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-lo);
    margin-bottom:6px;
  }
  .card-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:18px;
    margin-bottom:10px;
  }
  .card-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-lo);
    padding:4px 0;
  }
  .card-row span:last-child{color:var(--text-hi);}

  .grade-pill{
    display:inline-block;
    padding:2px 10px;
    border-radius:20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .grade-A{background:rgba(45,212,191,0.18); color:var(--teal);}
  .grade-B{background:rgba(240,169,78,0.18); color:var(--amber);}
  .grade-other{background:rgba(242,114,122,0.18); color:var(--coral);}

  .card-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .card-actions button{
    flex:1;
    padding:8px;
    font-size:12px;
    background:rgba(255,255,255,0.05);
    color:var(--text-lo);
    border:1px solid var(--glass-border);
  }
  .card-actions button:hover{color:var(--text-hi);}
  .card-actions .del:hover{color:var(--coral); border-color:var(--coral);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-lo);
    font-size:14px;
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Student records</p>
      <h1>Class roster</h1>
    </div>
    <p class="count" id="countLabel">0 students</p>
  </header>

  <div class="toolbar">
    <div class="glass">
      <input class="search" id="searchInput" type="text" placeholder="Search by name or course…">
    </div>
    <button class="btn-primary" onclick="toggleForm()">+ Add student</button>
  </div>

  <div class="glass" id="addForm">
    <input id="fName" type="text" placeholder="Full name">
    <input id="fAge" type="number" placeholder="Age">
    <input id="fGrade" type="text" placeholder="Grade (A, B, C…)">
    <input id="fCourse" type="text" placeholder="Course">
    <button class="btn-primary" onclick="submitStudent()">Save</button>
    <button class="btn-ghost" onclick="toggleForm()">Cancel</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const API = "/students";
let students = [];

function gradeClass(grade){
  if(!grade) return "grade-other";
  const g = grade[0].toUpperCase();
  if(g === "A") return "grade-A";
  if(g === "B") return "grade-B";
  return "grade-other";
}

async function loadStudents(){
  const res = await fetch(API);
  students = await res.json();
  render();
}

function render(filter=""){
  const grid = document.getElementById("grid");
  const q = filter.trim().toLowerCase();
  const visible = students.filter(s =>
    !q || s.name.toLowerCase().includes(q) || (s.course || "").toLowerCase().includes(q)
  );

  document.getElementById("countLabel").textContent =
    `${visible.length} student${visible.length === 1 ? "" : "s"}`;

  if(visible.length === 0){
    grid.innerHTML = `<div class="empty">No students match. Try a different search, or add one above.</div>`;
    return;
  }

  grid.innerHTML = visible.map(s => `
    <div class="glass card entering" data-id="${s.id}">
      <div class="card-id">ID #${s.id}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-row"><span>Age</span><span>${s.age ?? "—"}</span></div>
      <div class="card-row"><span>Course</span><span>${s.course ?? "—"}</span></div>
      <div class="card-row"><span>Grade</span><span class="grade-pill ${gradeClass(s.grade)}">${s.grade ?? "—"}</span></div>
      <div class="card-actions">
        <button onclick="editStudent(${s.id})">Edit</button>
        <button class="del" onclick="removeStudent(${s.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

function toggleForm(){
  document.getElementById("addForm").classList.toggle("open");
}

async function submitStudent(){
  const name = document.getElementById("fName").value.trim();
  if(!name){ alert("Name is required."); return; }

  const payload = {
    name,
    age: document.getElementById("fAge").value || null,
    grade: document.getElementById("fGrade").value || null,
    course: document.getElementById("fCourse").value || null,
  };

  await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  ["fName","fAge","fGrade","fCourse"].forEach(id => document.getElementById(id).value = "");
  toggleForm();
  await loadStudents();
}

async function editStudent(id){
  const student = students.find(s => s.id === id);
  const newGrade = prompt(`Update grade for ${student.name}:`, student.grade || "");
  if(newGrade === null) return;

  await fetch(`${API}/${id}`, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ grade: newGrade })
  });

  await loadStudents();
}

async function removeStudent(id){
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card){
    card.classList.add("removing");
    await new Promise(r => setTimeout(r, 300));
  }
  await fetch(`${API}/${id}`, { method: "DELETE" });
  await loadStudents();
}

document.getElementById("searchInput").addEventListener("input", (e) => render(e.target.value));

loadStudents();
</script>

</body>
</html>
